name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  notarized-release:
    name: Signed and notarized DMG
    runs-on: macos-14
    environment: macos-release

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Restore the pinned WeChat native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runtime_dir="$RUNNER_TEMP/wechat-native-runtime"
          mkdir -p "$runtime_dir"
          gh release download native-wechat-runtime-1 \
            --pattern humhum-wechat-reader-aarch64-apple-darwin \
            --pattern libWCDB.dylib \
            --dir "$runtime_dir"

          reader="$runtime_dir/humhum-wechat-reader-aarch64-apple-darwin"
          wcdb="$runtime_dir/libWCDB.dylib"
          manifest="src-tauri/resources/wechat/native-manifest.json"
          test -f "$reader"
          test -f "$wcdb"
          test -f "$manifest"

          expected_reader="$(jq -er '.reader.sha256' "$manifest")"
          expected_wcdb="$(jq -er '.wcdb.sha256' "$manifest")"
          actual_reader="$(shasum -a 256 "$reader" | awk '{print $1}')"
          actual_wcdb="$(shasum -a 256 "$wcdb" | awk '{print $1}')"
          test "$actual_reader" = "$expected_reader"
          test "$actual_wcdb" = "$expected_wcdb"

          install -m 0755 "$reader" \
            src-tauri/binaries/humhum-wechat-reader-aarch64-apple-darwin
          install -m 0644 "$wcdb" src-tauri/resources/wechat/libWCDB.dylib

      - name: Prepare the notarization API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        env:
          CI: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri -- build --bundles dmg

      - name: Verify the notarized artifact
        run: |
          dmg_path="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" -quiet || true; rmdir "$mount_dir" || true' EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          xcrun stapler validate "$app_path"
          spctl -a -vvv -t exec "$app_path"
          hdiutil verify "$dmg_path"
          codesign --verify --verbose "$dmg_path"
          checksum_path="${dmg_path}.sha256"
          shasum -a 256 "$dmg_path" > "$checksum_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=$checksum_path" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DMG_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$DMG_PATH" "$CHECKSUM_PATH" \
              --title "HUMHUM $RELEASE_TAG" \
              --generate-notes
          fi
