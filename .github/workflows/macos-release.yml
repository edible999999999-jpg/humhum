name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  notarized-release:
    name: Signed and notarized DMG
    runs-on: macos-14
    environment: macos-release

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Restore the pinned WeChat native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runtime_dir="$RUNNER_TEMP/wechat-native-runtime"
          mkdir -p "$runtime_dir"
          gh release download native-wechat-runtime-1 \
            --pattern humhum-wechat-reader-aarch64-apple-darwin \
            --pattern libWCDB.dylib \
            --dir "$runtime_dir"

          reader="$runtime_dir/humhum-wechat-reader-aarch64-apple-darwin"
          wcdb="$runtime_dir/libWCDB.dylib"
          manifest="src-tauri/resources/wechat/native-manifest.json"
          test -f "$reader"
          test -f "$wcdb"
          test -f "$manifest"

          expected_reader="$(jq -er '.reader.sha256' "$manifest")"
          expected_wcdb="$(jq -er '.wcdb.sha256' "$manifest")"
          actual_reader="$(shasum -a 256 "$reader" | awk '{print $1}')"
          actual_wcdb="$(shasum -a 256 "$wcdb" | awk '{print $1}')"
          test "$actual_reader" = "$expected_reader"
          test "$actual_wcdb" = "$expected_wcdb"

          install -m 0755 "$reader" \
            src-tauri/binaries/humhum-wechat-reader-aarch64-apple-darwin
          install -m 0644 "$wcdb" src-tauri/resources/wechat/libWCDB.dylib

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/humhum-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          python3 - "$certificate_path" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          encoded = "".join(os.environ["APPLE_CERTIFICATE"].split())
          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(encoded, validate=True)
          )
          PY
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Prepare the notarization API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build the signed application
        env:
          CI: "true"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri -- build --bundles app

      - name: Finalize and notarize the application and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          app_path="src-tauri/target/release/bundle/macos/HumHum.app"
          reader="$app_path/Contents/MacOS/humhum-wechat-reader"
          wcdb="$app_path/Contents/Resources/wechat/libWCDB.dylib"
          test -d "$app_path"
          test -f "$reader"
          test -f "$wcdb"

          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$reader"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$wcdb"
          npm run native:wechat:finalize-app -- "$app_path"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          app_zip="$RUNNER_TEMP/HumHum.app.zip"
          ditto -c -k --keepParent "$app_path" "$app_zip"
          xcrun notarytool submit "$app_zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$app_path"

          version="$(node -p 'require("./package.json").version')"
          dmg_dir="src-tauri/target/release/bundle/dmg"
          dmg_path="$dmg_dir/HumHum_${version}_aarch64.dmg"
          staging="$(mktemp -d)"
          mkdir -p "$dmg_dir"
          ditto "$app_path" "$staging/HumHum.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "HumHum" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "$dmg_path"
          codesign --force --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"

      - name: Verify the notarized artifact
        run: |
          dmg_path="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" -quiet || true; rmdir "$mount_dir" || true' EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          node scripts/finalize-wechat-app-runtime.mjs --verify "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl -a -vvv -t exec "$app_path"
          hdiutil verify "$dmg_path"
          codesign --verify --verbose "$dmg_path"
          checksum_path="${dmg_path}.sha256"
          shasum -a 256 "$dmg_path" > "$checksum_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=$checksum_path" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DMG_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$DMG_PATH" "$CHECKSUM_PATH" \
              --title "HUMHUM $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Remove the temporary signing keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi
