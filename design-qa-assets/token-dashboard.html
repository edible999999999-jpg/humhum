<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token 用量 · tokscale 审计</title>
<style>
  @font-face{font-family:"HUMHUM Sans";src:url("../android/app/src/main/res/font/noto_sans_sc.ttf") format("truetype");font-weight:100 900;font-display:block}
  @font-face{font-family:"HUMHUM Serif";src:url("../android/app/src/main/res/font/noto_serif_sc.ttf") format("truetype");font-weight:100 900;font-display:block}
  @font-face{font-family:"HUMHUM Mono";src:url("../android/app/src/main/res/font/roboto_mono.ttf") format("truetype");font-weight:100 900;font-display:block}
  :root{
    --board:#e8e9e7; --paper:#f8f8f5; --surface:#fff; --ink:#191b1e;
    --muted:#686b70; --faint:#96999f; --rule:#dfe1de;
    --focus:#1c1e1d; --focus-raised:#282b29; --on-focus:#f8f6ef;
    --humi:#6d5ccc; --hype:#b0462f; --hush:#287864;
    --hexa:#c08a0a; --hexa-soft:#fff3cf; --hexa-signal:#ffc928;
    --s-input:#3b6ea5; --s-cread:#6d5ccc; --s-cwrite:#c08a0a; --s-out:#287864; --s-reason:#b0462f;
    --serif:"HUMHUM Serif",serif; --sans:"HUMHUM Sans",sans-serif; --mono:"HUMHUM Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-synthesis:none}
  html{background:var(--board)}
  body{background:var(--board);color:var(--ink);font-family:var(--sans);letter-spacing:0;line-height:1.5;-webkit-font-smoothing:antialiased}
  .stage{max-width:960px;margin:0 auto;padding:52px 48px 96px}
  /* editorial intro — no card */
  .kicker{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  .kicker .snap{font-family:var(--mono);text-transform:none;letter-spacing:0;color:var(--faint)}
  .title{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.18;margin-bottom:8px}
  .note{color:var(--muted);font-size:13px;max-width:520px}
  .note b{color:var(--ink);font-weight:600}
  /* one dark focus surface */
  .focus{background:var(--focus);color:var(--on-focus);border-radius:8px;padding:24px 26px;margin:28px 0 0;display:flex;align-items:baseline;gap:32px;flex-wrap:wrap}
  .focus .f-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--hexa-signal)}
  .focus .f-num{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1}
  .focus .f-sub{font-family:var(--mono);font-size:12px;color:#b9bcbe;margin-top:6px}
  .focus .f-cost{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--hexa-signal)}
  .focus .f-block{display:flex;flex-direction:column;gap:2px}
  /* restrained tabs — Hexa signature */
  .tabs{display:flex;gap:4px;margin:32px 0 0;border-bottom:1px solid var(--rule)}
  .tab{padding:9px 14px 11px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;font-weight:600;transition:.15s;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);border-bottom-color:var(--hexa)}
  /* section headers separated by whitespace, not cards */
  .section{margin-top:40px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  .section-title{font-family:var(--serif);font-size:20px;font-weight:600}
  .section-meta{font-family:var(--mono);font-size:12px;color:var(--faint)}
  /* number groupings — flat, unframed, divided by a rule (身体信号 style) */
  .numgroup{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule)}
  .numgroup .n{padding:16px 18px 14px;border-right:1px solid var(--rule)}
  .numgroup .n:last-child{border-right:none}
  .numgroup .n .nv{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
  .numgroup .n .nv.cost{color:var(--hexa)}
  .numgroup .n .nl{color:var(--muted);font-size:12px;margin-top:4px}
  .numgroup .n .ns{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
  /* chart: gridded plot, centered stacked bars, no container card */
  .chart{position:relative;padding:6px 0 0 52px}
  .chart .plot{position:relative;height:230px}
  .chart .gl{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
  .chart .gl .glv{position:absolute;left:-50px;top:-8px;width:44px;text-align:right;font-family:var(--mono);font-size:10px;color:var(--faint)}
  .chart .bars{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:12px}
  .chart .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;width:clamp(28px,5vw,56px);position:relative}
  .chart .col .stkwrap{display:flex;flex-direction:column;justify-content:flex-end;width:100%;height:100%}
  .chart .col .stk{width:100%;transition:.15s}
  .chart .col .stk:first-child{border-radius:3px 3px 0 0}
  .chart .col:hover .stk{filter:brightness(1.12) saturate(1.1)}
  .chart .xaxis{display:flex;justify-content:center;gap:12px;margin-top:8px}
  .chart .xaxis .xl{width:clamp(28px,5vw,56px);text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .chart.dense .bars,.chart.dense .xaxis{gap:3px}
  .chart.dense .col,.chart.dense .xaxis .xl{width:auto;flex:1;min-width:0}
  .chart.dense .xaxis .xl{transform:rotate(-45deg);transform-origin:top center;height:26px;font-size:9px}
  .chart-empty{height:230px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:18px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
  /* editorial tables — thin rules, no zebra card */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:11px 12px;border-bottom:1px solid var(--rule)}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--ink);cursor:pointer;user-select:none}
  tbody td{font-family:var(--mono);font-size:13px}
  tbody td:first-child{font-family:var(--sans);font-weight:600}
  tbody tr:hover{background:var(--surface)}
  td.cost{color:var(--hexa)}
  .bar{display:block;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
  .bar span{display:block;height:100%;background:var(--hexa)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr;gap:0}.numgroup{grid-template-columns:repeat(2,1fr)}.numgroup .n:nth-child(2n){border-right:none}}
  .tip{position:fixed;background:var(--focus);color:var(--on-focus);border-radius:6px;padding:8px 11px;font-family:var(--mono);font-size:12px;pointer-events:none;opacity:0;transition:.1s;z-index:10;white-space:nowrap}
</style>
</head>
<body>
<div class="stage">
  <p class="kicker">数据源 TOKSCALE · 快照 <span class="snap" id="snap">—</span></p>
  <h1 class="title">Token 用量</h1>
  <p class="note" id="rangeNote">加载中…</p>
  <section class="focus" id="focus"></section>
  <nav class="tabs" id="tabs"></nav>

  <section class="section">
    <div class="numgroup" id="numgroup"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title" id="chartTitle">趋势</h2>
      <span class="section-meta" id="chartMeta"></span>
    </div>
    <div class="chart" id="chart"></div>
    <div class="legend">
      <span><i style="background:var(--s-input)"></i>输入</span>
      <span><i style="background:var(--s-cread)"></i>缓存读</span>
      <span><i style="background:var(--s-cwrite)"></i>缓存写</span>
      <span><i style="background:var(--s-out)"></i>输出</span>
      <span><i style="background:var(--s-reason)"></i>推理</span>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2 class="section-title">周期明细</h2></div>
    <table id="periodTable"></table>
  </section>

  <div class="grid2">
    <section class="section">
      <div class="section-head"><h2 class="section-title">按模型</h2><span class="section-meta">全量</span></div>
      <table id="modelTable"></table>
    </section>
    <section class="section">
      <div class="section-head"><h2 class="section-title">按客户端</h2><span class="section-meta">全量</span></div>
      <table id="clientTable"></table>
    </section>
  </div>
</div>
<div class="tip" id="tip"></div>
<script src="./token-dashboard-data.js"></script>
<script src="./token-dashboard.js"></script>
</body>
</html>
